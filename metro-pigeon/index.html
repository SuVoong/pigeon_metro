<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Metro Pigeon</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #0a0a0a;
      overflow: hidden;
      font-family: monospace;
      color: #f5e0a0;
    }
    canvas {
      display: block;
      image-rendering: pixelated;
      image-rendering: -moz-crisp-edges;
      image-rendering: crisp-edges;
      width: 100%;
      height: 100%;
      cursor: none;
    }
  </style>
</head>
<body>
  <canvas id="game"></canvas>

  <!-- Mecánica: cargados primero, definen el estado global -->
  <script src="js/mecanica/estado.js"></script>
  <script src="js/mecanica/input.js"></script>
  <script src="js/mecanica/camara.js"></script>
  <script src="js/mecanica/colisiones.js"></script>
  <script src="js/mecanica/spawning.js"></script>

  <!-- Personajes -->
  <script src="js/personajes/paloma.js"></script>

  <!-- Escenarios -->
  <script src="js/escenarios/metro.js"></script>
  <script src="js/escenarios/renfe.js"></script>

  <!-- Pantallas -->
  <script src="js/pantallas/inicio.js"></script>
  <script src="js/pantallas/pausa.js"></script>
  <script src="js/pantallas/fin.js"></script>

  <!-- Bucle principal: cargado al final, depende de todo lo anterior -->
  <script src="js/main.js"></script>
</body>
</html>
